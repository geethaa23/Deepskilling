<section class="reactive-form-page">
  <div class="reactive-form-card">
    <h1>Reactive Enrollment Request</h1>
    <form [formGroup]="enrollForm" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="studentName">Student name</label>
        <input id="studentName" type="text" formControlName="studentName" />
        <span class="error" *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['required']">
          Name is required
        </span>
        <span class="error" *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['minlength']">
          Name must be at least 3 characters
        </span>
      </div>

      <div class="form-group">
        <label for="studentEmail">Student email</label>
        <input id="studentEmail" type="email" formControlName="studentEmail" />
        <span class="error" *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.errors?.['required']">
          Email is required
        </span>
        <span class="error" *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.errors?.['email']">
          Enter a valid email address.
        </span>
        <span class="error" *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">
          Email taken
        </span>
      </div>

      <div class="form-group">
        <label for="courseId">Course code</label>
        <input id="courseId" type="text" formControlName="courseId" />
        <span class="error" *ngIf="enrollForm.get('courseId')?.touched && enrollForm.get('courseId')?.errors?.['required']">
          Course code is required
        </span>
        <span class="error" *ngIf="enrollForm.get('courseId')?.touched && enrollForm.get('courseId')?.errors?.['noCourseCode']">
          Course code starting with XX is not allowed.
        </span>
      </div>

      <div class="form-group">
        <label for="preferredSemester">Preferred semester</label>
        <select id="preferredSemester" formControlName="preferredSemester">
          <option value="Odd">Odd</option>
          <option value="Even">Even</option>
        </select>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" formControlName="agreeToTerms" />
          I agree to the terms and conditions.
        </label>
        <span class="error" *ngIf="enrollForm.get('agreeToTerms')?.touched && enrollForm.get('agreeToTerms')?.errors?.['required']">
          You must accept the terms
        </span>
      </div>

      <div class="form-group">
        <label>Additional Courses</label>
        <div class="course-array" *ngFor="let ctrl of additionalCourses.controls; let i = index">
          <input [formControl]="ctrl" placeholder="Additional course ID" />
          <button type="button" class="remove" (click)="removeCourse(i)">Remove</button>
          <span class="error" *ngIf="ctrl.touched && ctrl.errors?.['required']">Course is required</span>
        </div>
        <button type="button" class="secondary full-width" (click)="addCourse()">Add Another Course</button>
      </div>

      <div class="button-row">
        <button type="submit" class="full-width" [disabled]="enrollForm.invalid || submitting">Submit</button>
        <button type="button" class="secondary full-width" (click)="reset()">Reset</button>
      </div>
    </form>

    <div class="success-message" *ngIf="submitted">
      Reactive enrollment submitted successfully!
    </div>
  </div>
</section>
